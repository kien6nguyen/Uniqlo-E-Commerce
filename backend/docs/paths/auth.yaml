auth/register:
  post:
    tags: [Auth]
    summary: Đăng ký tài khoản mới
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AuthRegisterRequest'
    responses:
      '201':
        description: Đăng ký thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Đăng ký thành công" }
                user: { $ref: '../components/schemas.yaml#/User' }
      '400':
        description: Lỗi validation (Email đã tồn tại, mật khẩu không khớp/không đủ mạnh)
      '500':
        description: Lỗi server

auth/login:
  post:
    tags: [Auth]
    summary: Đăng nhập bằng email và mật khẩu
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AuthLoginRequest'
    responses:
      '200':
        description: Đăng nhập thành công, trả về JWT Token
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AuthTokenResponse'
      '401':
        description: Sai tên đăng nhập hoặc mật khẩu
      '500':
        description: Lỗi server

auth/logout:
  get:
    tags: [Auth]
    summary: Đăng xuất (Client chỉ cần xóa Token)
    description: Endpoint này chủ yếu trả về phản hồi thành công, client chịu trách nhiệm xóa JWT token.
    responses:
      '200':
        description: Đăng xuất thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Đăng xuất thành công" }
      '500':
        description: Lỗi server

auth/forgot-password:
  post:
    tags: [Auth]
    summary: Gửi link/token đặt lại mật khẩu đến email
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    responses:
      '200':
        description: Đã gửi link đặt lại mật khẩu
      '404':
        description: Email không tồn tại
      '500':
        description: Lỗi server

auth/reset-password:
  post:
    tags: [Auth]
    summary: Đặt lại mật khẩu bằng token từ email
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, newPassword]
            properties:
              token:
                type: string
                description: JWT Token nhận được từ email reset link
              newPassword:
                type: string
                format: password
                description: Mật khẩu mới
    responses:
      '200':
        description: Đặt lại mật khẩu thành công
      '400':
        description: Token thiếu/không hợp lệ hoặc Mật khẩu mới không đủ mạnh
      '404':
        description: Không tìm thấy user
auth/google:
  get:
    tags:
      - Auth
    summary: Đăng nhập bằng Google OAuth
    description: |
      Chuyển hướng người dùng tới trang đăng nhập của Google để xác thực tài khoản.
      Sau khi đăng nhập thành công, Google sẽ redirect về endpoint `/auth/google/callback`.
    parameters: []
    responses:
      "302":
        description: Redirect tới trang đăng nhập Google
      "500":
        description: Lỗi server trong quá trình khởi tạo OAuth

auth/google/callback:
  get:
    tags:
      - Auth
    summary: Callback sau khi đăng nhập Google OAuth
    description: |
      Endpoint mà Google redirect về sau khi người dùng đăng nhập và cho phép ứng dụng truy cập.
      Server sẽ xử lý token trả về và tạo tài khoản hoặc đăng nhập người dùng vào hệ thống.
    responses:
      "200":
        description: Đăng nhập Google thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Đăng nhập Google thành công"
                token:
                  type: string
                  description: JWT token được cấp sau khi đăng nhập thành công
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  $ref: "../components/schemas.yaml#/User"
      "401":
        description: Đăng nhập thất bại hoặc bị từ chối
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: "Xác thực Google thất bại"
      "500":
        description: Lỗi server



