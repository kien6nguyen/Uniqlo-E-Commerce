admin/dashboard/simple:
  get:
    tags: [Admin]
    summary: Simple Dashboard - Tổng quan cửa hàng
    description: Hiển thị các số liệu tổng quan như tổng người dùng, đơn hàng, doanh thu, và sản phẩm bán chạy.
    responses:
      "200":
        description: Dashboard dữ liệu
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    totalUsers: { type: integer, example: 250 }
                    newUsersThisMonth: { type: integer, example: 12 }
                    totalOrders: { type: integer, example: 540 }
                    totalRevenue: { type: number, example: 12900000 }
                    bestSellingProducts:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string, example: "iPhone 15" }
                          totalSold: { type: integer, example: 230 }

admin/dashboard/advanced:
  get:
    tags: [Admin]
    summary: Advanced Dashboard - Thống kê theo thời gian
    parameters:
      - in: query
        name: startDate
        schema: { type: string, format: date }
      - in: query
        name: endDate
        schema: { type: string, format: date }
      - in: query
        name: interval
        schema:
          type: string
          enum: [year, quarter, month, week]
          default: year
    responses:
      "200":
        description: Trả về thống kê theo khoảng thời gian
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  type: object
                  properties:
                    interval: { type: string, example: "month" }
                    stats:
                      type: array
                      items:
                        type: object
                        properties:
                          _id: { type: integer, example: 1 }
                          totalOrders: { type: integer, example: 45 }
                          totalRevenue: { type: number, example: 9000000 }
                          totalProfit: { type: number, example: 2500000 }

# ----------------------------
# USER MANAGEMENT
# ----------------------------
admin/users:
  get:
    tags: [Admin]
    summary: Lấy danh sách người dùng
    responses:
      "200":
        description: Danh sách người dùng
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                count: { type: integer, example: 5 }
                users:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/User"
admin/users/{id}:
  get:
    tags: [Admin]
    summary: Lấy thông tin chi tiết người dùng
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Thông tin người dùng chi tiết
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/User"
  patch:
    tags: [Admin]
    summary: Cập nhật thông tin người dùng (Admin)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              fullname: { type: string, example: "Nguyễn Văn B" }
              role: { type: string, enum: [user, admin], example: "admin" }
    responses:
      "200":
        description: Cập nhật thành công
admin/users/{id}/ban:
  patch:
    tags: [Admin]
    summary: Khóa tài khoản người dùng
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: User bị khóa thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "User banned" }

# ----------------------------
# PRODUCT MANAGEMENT
# ----------------------------
admin/products:
  post:
    tags: [Admin]
    summary: Tạo sản phẩm mới
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/Product"
    responses:
      "201":
        description: Sản phẩm được tạo
  patch:
    tags: [Admin]
    summary: Cập nhật sản phẩm
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/Product"
    responses:
      "200":
        description: Cập nhật sản phẩm thành công
  delete:
    tags: [Admin]
    summary: Xóa sản phẩm
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Xóa thành công

# ----------------------------
# ORDER MANAGEMENT
# ----------------------------
admin/orders:
  get:
    tags: [Admin]
    summary: Xem danh sách đơn hàng
    parameters:
      - in: query
        name: range
        schema:
          type: string
          enum: [today, week, month]
          example: week
    responses:
      "200":
        description: Danh sách đơn hàng
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                count: { type: integer, example: 12 }
                orders:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, example: "65ad12b9c1e2f3a4b5c6d7e8" }
                      totalAmount: { type: number, example: 250000 }
                      status: { type: string, example: "completed" }
                      createdAt: { type: string, format: date-time }

admin/orders/{id}:
  get:
    tags: [Admin]
    summary: Xem chi tiết đơn hàng
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Thông tin chi tiết đơn hàng
  patch:
    tags: [Admin]
    summary: Cập nhật trạng thái đơn hàng
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: "confirmed" }
    responses:
      "200":
        description: Cập nhật trạng thái thành công

# ----------------------------
# DISCOUNT MANAGEMENT
# ----------------------------
admin/discounts:
  get:
    tags: [Admin]
    summary: Lấy danh sách mã giảm giá
    responses:
      "200":
        description: Danh sách discount codes
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                count: { type: integer, example: 2 }
                discounts:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/Discount"

  post:
    tags: [Admin]
    summary: Tạo mã giảm giá mới
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/Discount"
    responses:
      "201":
        description: Discount code created

admin/discounts/{id}:
  get:
    tags: [Admin]
    summary: Xem chi tiết mã giảm giá
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID của mã giảm giá
    responses:
      "200":
        description: Chi tiết mã giảm giá
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Discount"

  patch:
    tags: [Admin]
    summary: Cập nhật thông tin mã giảm giá
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: "SALE2025" }
              value: { type: number, example: 15 }
              maxUsage: { type: integer, example: 100 }
              expiresAt: { type: string, format: date-time, example: "2025-12-31T23:59:59Z" }
    responses:
      "200":
        description: Cập nhật mã giảm giá thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Discount updated successfully" }

  delete:
    tags: [Admin]
    summary: Xóa mã giảm giá
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID của mã giảm giá cần xóa
    responses:
      "200":
        description: Xóa mã giảm giá thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Discount deleted successfully" }

