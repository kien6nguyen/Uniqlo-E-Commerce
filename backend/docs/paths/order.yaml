orders:
  post:
    tags: [Orders]
    summary: Tạo đơn hàng (guest hoặc user)
    description: |
      API cho phép **khách vãng lai (guest)** hoặc **người dùng đã đăng nhập** tạo đơn hàng mới.
      - Nếu có JWT → đơn hàng gán cho người dùng.
      - Nếu không → tự động đánh dấu là `isGuest: true`.
      - Chỉ cần cung cấp `items` và `shippingAddress`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object

            required: [items, shippingAddress]
            properties:
              items:
                type: array
                description: Danh sách sản phẩm trong đơn hàng
                items:
                  type: object
                  required: [product, quantity]
                  properties:
                    product:
                      type: string
                      example: "67301234567890abcdef123"
                    quantity:
                      type: integer
                      example: 2
                    variant:
                      type: string
                      example: "Size M - Màu Trắng"
                    price:
                      type: number
                      example: 199000
              shippingAddress:
                type: object
                required: [receiver, phone, address]
                properties:
                  receiver:
                    type: string
                    example: "Nguyễn Văn A"
                  phone:
                    type: string
                    example: "0901234567"
                  address:
                    type: string
                    example: "123 Lê Lợi, Quận 1, TP.HCM"
              discountCode:
                type: string
                example: "SALE10"
              loyaltyPointsUsed:
                type: number
                example: 50
              paymentMethod:
                type: string
                enum: [cod, vnpay]
                default: cod
              isGuest:
                type: boolean
                default: true
    responses:
      "201":
        description: Đơn hàng tạo thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Đơn hàng đã được tạo thành công" }
                order:
                  $ref: "../components/schemas.yaml#/Order"
      "400":
        description: Thiếu dữ liệu hoặc không hợp lệ
      "500":
        description: Lỗi server nội bộ

  get:
    tags: [Orders]
    summary: Get user order history
    description: Returns all orders created by the logged-in user, sorted by newest first.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: List of orders
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                count: { type: integer, example: 3 }
                orders:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/Order"
      "401":
        description: Unauthorized
      "500":
        description: Internal server error

orders/{id}:
  get:
    tags: [Orders]
    summary: Get order details by ID
    description: Fetch order details including products and shipping address.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Order detail retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                order:
                  $ref: "../components/schemas.yaml#/Order"
      "403":
        description: Access denied
      "404":
        description: Order not found
  delete:
    tags: [Orders]
    summary: Cancel an order
    description: Cancels an order if it has not been shipped or delivered yet.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Order cancelled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Đơn hàng đã được huỷ" }
      "400":
        description: Cannot cancel a delivered order
      "404":
        description: Order not found

orders/{id}/tracking:
  get:
    tags: [Orders]
    summary: Track order status history
    description: Retrieve the status change history of a specific order.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Order status history
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                currentStatus: { type: string, example: "shipping" }
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      status: { type: string, example: "confirmed" }
                      updatedAt: { type: string, format: date-time, example: "2025-11-10T12:00:00.000Z" }
      "404":
        description: Order not found

/orders/guest/{id}:
  get:
    tags: [Orders]
    summary: Guest order tracking by order ID
    description: Allows guest users to view their order details using order ID and phone/email verification.
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: email
        in: query
        schema: { type: string }
        example: "user@example.com"
      - name: phone
        in: query
        schema: { type: string }
        example: "0901234567"
    responses:
      "200":
        description: Order found
      "403":
        description: Verification failed
      "404":
        description: Order not found

orders/{id}/payment:
  patch:
    tags: [Orders]
    summary: Update payment status
    description: Used by system or admin to mark payment as "paid", "unpaid", or "refunded".
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/OrderStatusUpdateRequest'
    responses:
      "200":
        description: Payment status updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Cập nhật trạng thái thanh toán thành công" }
                order:
                  $ref: "../components/schemas.yaml#/Order"
      "404":
        description: Order not found
      "500":
        description: Internal server error
