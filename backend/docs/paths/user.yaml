user/me:
  get:
    summary: Lấy thông tin người dùng hiện tại
    tags: [User]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Thông tin người dùng
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    id:
                      type: string
                    email:
                      type: string
                    fullname:
                      type: string
                    hasPassword:
                      type: boolean
                    shippingAddress:
                      type: array
      '404':
        description: User not found
  patch:
    summary: Cập nhật thông tin người dùng
    tags: [User]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              fullname:
                type: string
                example: "Nguyen Van A"
    responses:
      '200':
        description: Cập nhật thông tin thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                data:
                  type: object

user/me/password:
  patch:
    summary: Đổi mật khẩu
    tags: [User]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - newPassword
              - confirmPassword
            properties:
              newPassword:
                type: string
                format: password
                example: "NewPass@123"
              confirmPassword:
                type: string
                format: password
                example: "NewPass@123"
    responses:
      '200':
        description: Đổi mật khẩu thành công
      '400':
        description: Mật khẩu không hợp lệ hoặc không khớp

user/me/addresses:
  post:
    summary: Thêm địa chỉ giao hàng
    tags: [User]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - receiver
              - phone
              - address
            properties:
              receiver:
                type: string
                example: "Nguyen Van B"
              phone:
                type: string
                example: "0987654321"
              address:
                type: string
                example: "123 Đường ABC, Quận 1, TP.HCM"
    responses:
      '201':
        description: Thêm địa chỉ thành công
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                data:
                  type: array

user/me/addresses/{id}:
  patch:
    summary: Cập nhật địa chỉ giao hàng
    tags: [User]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: ID của địa chỉ cần cập nhật
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - receiver
              - phone
              - address
            properties:
              receiver:
                type: string
                example: "Nguyen Van B"
              phone:
                type: string
                example: "0987654321"
              address:
                type: string
                example: "123 Đường ABC, Quận 1, TP.HCM"
    responses:
      '200':
        description: Cập nhật địa chỉ thành công
  delete:
    summary: Xóa địa chỉ giao hàng
    tags: [User]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: ID của địa chỉ cần xóa
    responses:
      '200':
        description: Địa chỉ đã được xóa thành công
      '404':
        description: Không tìm thấy địa chỉ
      '500':
        description: Lỗi server