/carts/add:
  post:
    tags: [Cart]
    summary: Add or update product in cart
    description: Thêm hoặc cập nhật số lượng sản phẩm trong giỏ hàng
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/AddOrUpdateCartItemRequest'
    responses:
      '200':
        description: Added or updated cart successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/CartResponse'

/carts/update:
  put:
    tags: [Cart]
    summary: Update product quantity in cart
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UpdateCartItemQuantityRequest'
    responses:
      '200':
        description: Cart updated successfully

/carts/remove/{productId}:
  delete:
    tags: [Cart]
    summary: Remove product from cart
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Item removed from cart

/carts/summary:
  get:
    tags: [Cart]
    summary: Get cart summary
    responses:
      '200':
        description: Successfully retrieved cart summary
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/CartResponse'


/carts/apply-discount:
  post:
    tags: [Cart]
    summary: Apply discount code
    description: Áp dụng mã giảm giá vào giỏ hàng hiện tại
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ApplyDiscountRequest'
    responses:
      '200':
        description: Discount applied successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/CartResponse'
