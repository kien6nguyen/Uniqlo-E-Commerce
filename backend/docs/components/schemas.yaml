User:
  type: object
  properties:
    _id:
      type: string
      description: ID của người dùng (tự động tạo)
    email:
      type: string
      format: email
    fullname:
      type: string
    role:
      type: string
      enum: [user, admin, customer]
      default: user
    shippingAddress:
      type: array
      items:
        $ref: '#/ShippingAddress'
    loyaltyPoints:
      type: number
      default: 0
    totalLoyaltyEarned:
      type: number
      default: 0
  example:
    _id: 65e9a444d32a4e21d5c2d3a3
    email: user@example.com
    fullname: Nguyễn Văn A
    role: user
    shippingAddress: []
    loyaltyPoints: 100
    totalLoyaltyEarned: 500

Product:
  type: object
  required:
    - name
    - price
    - category
    - brand
  properties:
    id:
      type: string
      example: "64a8e7c9f1d23a6bcd123456"
    name:
      type: string
      example: "Áo thun cotton"
    brand:
      type: string
      example: "Coolmate"
    price:
      type: number
      example: 199000
    description:
      type: string
      example: "Áo thun cotton 100%, co giãn 4 chiều, thoáng mát, phù hợp mọi lứa tuổi."
    category:
      type: string
      enum: ["new product", "laptop", "phone", "accessory", "monitor"]
      example: "new product"
    stock:
      type: integer
      example: 50
    images:
      type: array
      items:
        type: string
      example:
        - "https://example.com/image1.jpg"
        - "https://example.com/image2.jpg"
    tags:
      type: array
      items:
        type: string
      example: ["áo thun", "cotton", "nam"]
    variants:
      type: array
      description: Danh sách các biến thể của sản phẩm
      items:
        $ref: "#/Variant"
    averageRating:
      type: number
      example: 4.5
    isHotDeal:
      type: boolean
      default: false
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Variant:
  type: object
  required:
    - name
    - price
  properties:
    name:
      type: string
      example: "Size M - Màu Trắng"
    price:
      type: number
      example: 199000
    stock:
      type: integer
      example: 20
    sku:
      type: string
      example: "TSHIRT-M-WHITE"

Discount:
  type: object
  required: [code, percentage]
  properties:
    code:
      type: string
      example: SALE50
      description: 5-character alphanumeric code
    description:
      type: string
    percentage:
      type: number
      minimum: 1
      maximum: 100
      example: 50
    usageLimit:
      type: integer
      default: 10
      maximum: 10
      example: 10
    usedCount:
      type: integer
      default: 0
      example: 2

ShippingAddress:
  type: object
  description: Thông tin địa chỉ giao hàng của người dùng
  required:
    - receiver
    - phone
    - address
  properties:
    receiver:
      type: string
      example: Nguyễn Văn A
    phone:
      type: string
      example: "0912345678"
    address:
      type: string
      example: "123 Lê Lợi, Quận 1, TP.HCM"

Review:
  type: object
  description: Đánh giá và bình luận của người dùng cho sản phẩm
  required:
    - product
  properties:
    _id:
      type: string
      description: ID của review
    product:
      type: string
      description: ID sản phẩm được đánh giá
    user:
      type: string
      description: ID người dùng (optional)
    rating:
      type: number
      minimum: 1
      maximum: 5
      example: 5
    comment:
      type: string
      example: "Sản phẩm rất chất lượng."
    createdAt:
      type: string
      format: date-time

Order:
  type: object
  description: Đơn hàng trong hệ thống
  required:
    - items
    - shippingAddress
    - totalAmount
    - finalAmount
  properties:
    _id:
      type: string
    user:
      type: string
      nullable: true
      description: ID người dùng nếu là user đã đăng nhập
    isGuest:
      type: boolean
      default: true
    guestInfo:
      type: object
      properties:
        fullname:
          type: string
        email:
          type: string
        phone:
          type: string
    items:
      type: array
      items:
        type: object
        required:
          - product
          - quantity
          - price
        properties:
          product:
            type: string
          quantity:
            type: integer
          price:
            type: number
          variant:
            type: string
    shippingAddress:
      $ref: '#/ShippingAddress'
    totalAmount:
      type: number
    discountCode:
      type: string
      nullable: true
    finalAmount:
      type: number
    loyaltyPointsEarned:
      type: number
      default: 0
    loyaltyPointsUsed:
      type: number
      default: 0
    payment:
      type: object
      properties:
        method:
          type: string
          enum: [cod, vnpay]
          default: cod
        status:
          type: string
          enum: [pending, paid, failed]
          default: pending
        transactionId:
          type: string
        bankCode:
          type: string
        paymentTime:
          type: string
          format: date-time
    status:
      type: string
      enum: [Pending, Paid, Shipped, Completed, Cancelled]
      default: Pending
    history:
      type: array
      items:
        type: object
        properties:
          status:
            type: string
          updatedAt:
            type: string
            format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CartItem:
  type: object
  properties:
    product:
      type: string
      description: Product ID
    quantity:
      type: integer
      minimum: 1
    price:
      type: number
    priceSnapshot:
      type: number
    variant:
      type: string
      nullable: true
    color:
      type: string
      nullable: true

CartResponse:
  type: object
  properties:
    discount:
      type: number
    discountCode:
      type: string
      nullable: true
    total:
      type: number

OrderResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    order:
      $ref: '#/Order'

LoyaltyBalance:
  type: object
  properties:
    success:
      type: boolean
      example: true
    userId:
      type: string
      example: "64b01b21efc123456789abcd"
    totalPoints:
      type: number
      example: 1200
      description: Tổng điểm đã tích lũy được
    usedPoints:
      type: number
      example: 300
      description: Tổng điểm đã sử dụng
    availablePoints:
      type: number
      example: 900
      description: Điểm còn lại có thể dùng

LoyaltyTransaction:
  type: object
  properties:
    action:
      type: string
      enum: [add, deduct]
      example: add
      description: Loại hành động (thêm hoặc trừ điểm)
    points:
      type: number
      example: 100
      description: Số điểm được cộng hoặc trừ
    reason:
      type: string
      example: "Thưởng cho đơn hàng #ORD123"
      description: Lý do điều chỉnh điểm
    timestamp:
      type: string
      format: date-time
      example: "2025-11-10T10:00:00.000Z"
      description: Thời gian thực hiện giao dịch

# --- New Request Schemas ---

AddOrUpdateCartItemRequest:
  type: object
  required:
    - productId
    - quantity
  properties:
    productId:
      type: string
    quantity:
      type: integer
    variant:
      type: string
    color:
      type: string

UpdateCartItemQuantityRequest:
  type: object
  required:
    - productId
    - quantity
  properties:
    productId:
      type: string
    quantity:
      type: integer

ApplyDiscountRequest:
  type: object
  required:
    - code
  properties:
    code:
      type: string

OrderStatusUpdateRequest:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [Pending, Paid, Shipped, Completed, Cancelled]

AuthLoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password

AuthTokenResponse:
  type: object
  properties:
    success:
      type: boolean
    message:
      type: string
    token:
      type: string
    user:
      $ref: "#/User"

AuthRegisterRequest:
  type: object
  required:
    - email
    - password
    - fullname
    - confirmPassword
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
    fullname:
      type: string
    confirmPassword:
      type: string
      format: password
    shippingAddress:
      type: string
    role:
      type: string
      enum: [user, admin]

ApiError:
  type: object
  properties:
    error:
      type: string

ApiResponseProducts:
  type: object
  properties:
    products:
      type: array
      items:
        $ref: '#/Product'
